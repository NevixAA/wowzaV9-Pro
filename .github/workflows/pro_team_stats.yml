name: Pro Team Stats

# Per-fixture team match statistics from API-Football /fixtures/statistics — the xG, possession
# and inside-box shots the feature set never had.
#
# WHY THIS IS ITS OWN WORKFLOW (created 2026-09-02)
#
# It used to be a step inside pro_collect.yml, gated on the DAILY sweep:
#
#     if: steps.collect.outcome == 'success' && github.event.schedule != '40 */2 * * *'
#
# The gate is correct and the collector is correct. What failed is the assumption underneath
# both: that the once-a-day cron actually fires. `pro: collect` has not committed at 06:xx UTC
# since 2026-08-26, so the sweep — and therefore this collection — simply never ran. Verified
# directly on 2026-09-02: `python -m src.pipelines.team_stats --limit 3 --dry-run` returned real
# rows (possession, shots, SOT, inside-box all 100% populated) in one API call. Working collector,
# valid credential, zero canonical rows, because the step was never reached.
#
# Coupling a collector's delivery to another workflow's least-frequent cron gives it the WORST
# delivery odds in the estate and hides the failure inside a job that reports success for its own
# reasons. Its own workflow, its own cron, its own health.
#
# Resumable and cached by design: already-collected fixture_ids are skipped by reading the
# existing table, and a finished fixture's statistics never change. So twice a day costs the same
# API budget as once a day (~47 new fixtures/day, ~47 calls), and a missed run is caught by the
# next one instead of losing a day.

on:
  schedule:
    # Twice daily, off the hour. Two firings rather than one because delivery is not guaranteed:
    # if either lands, the day is collected, and the second costs nothing when the first worked.
    - cron: '35 4 * * *'
    - cron: '35 16 * * *'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Comma-separated seasons (default 2026)'
        required: false
      limit:
        description: 'Max fixtures (blank = all)'
        required: false

concurrency:
  group: pro-team-stats
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # THE ACTUAL CAUSE OF EVERY FAILURE SO FAR. team_stats reads v9's league-id mapping through
      # src/data/v9_config.py rather than keeping a second copy that could drift — a good decision
      # — but that loader looks for v9 as a SIBLING directory, which exists only on a laptop.
      # In CI there was no v9 anywhere and no V9_LOCAL, so the run died on its first statement:
      #
      #   FileNotFoundError: v9 config not found at /home/runner/work/wowzaV9-Pro/v9/config.py
      #
      # That is why it failed in ONE SECOND on all four runs, before any API call — so it was
      # never the credential, never the quota, and never the job timeout. Read-only, exactly as
      # pro_weekly_audit, pro_live_odds and pro_paper_1x2 already do; Pro writes nothing to v9.
      - name: Check out v9 (read-only, for the league-id mapping)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          path: _v9
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas pyarrow requests

      - name: Collect team match statistics
        id: stats
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: |
          # `cmd | tee` reports TEE's exit code, so without this a crashed collector would look
          # like a pass. And `2>&1` is not decoration: the first version of this capture piped
          # only stdout, so the TRACEBACK — the one thing worth capturing — went to stderr and
          # never reached the summary. The step failed in 1 second three times running and the
          # published output was still empty.
          set -o pipefail
          SEASONS="${{ github.event.inputs.seasons }}"; [ -n "$SEASONS" ] || SEASONS=2026
          LIMIT="${{ github.event.inputs.limit }}"

          # CHUNK THE SCHEDULED RUN. NOTE: this was NOT why the earlier runs failed — that was the
          # missing v9 checkout above, which killed the job in one second before any of this
          # mattered. This comment previously asserted the timeout as the cause and was wrong.
          #
          # It is kept because the first successful catch-up is still genuinely large: the store
          # holds ZERO partitions, a full 2026 pass covers ~2,377 fixtures, and measured
          # /fixtures/statistics latency is ~1.02s per cold call — roughly 40 minutes against a
          # 30-minute timeout, before any rate-limit backoff.
          #
          # A chunk is safe because the collector SKIPS fixtures already in the store (it reports
          # "N fixture(s) already stored" on startup), so successive runs resume rather than
          # repeat. The table fills over a few days instead of failing forever, and once it is
          # caught up the limit costs nothing — there are simply fewer new fixtures than the cap.
          #
          # A manual dispatch can still pass its own limit, including a larger one.
          if [ -z "$LIMIT" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            # 250 -> 1000 on 2026-09-05, because the backfill just got much bigger: 17 top
            # divisions were added to collect domestic form for UEFA clubs, taking the catch-up
            # from ~2,377 fixtures to ~8,900. At 250 a run that is ~36 runs, i.e. about 18 days
            # before the form table is usable — long enough to block the tournament model that
            # needs it.
            #
            # Sized against MEASURED latency, not a guess: /fixtures/statistics answers in ~1.02s
            # cold, so 1,000 is ~17 minutes against the 30-minute timeout. That keeps a real
            # margin for the rate-limit backoff (up to 60s per stall) while finishing the
            # backfill in ~9 runs rather than 36.
            LIMIT=1000
            echo "scheduled run: chunking to $LIMIT fixtures (resumable; skips what is stored)"
          fi

          if [ -n "$LIMIT" ]; then
            python -m src.pipelines.team_stats --seasons "$SEASONS" --limit "$LIMIT" 2>&1 | tee stats.txt
          else
            python -m src.pipelines.team_stats --seasons "$SEASONS" 2>&1 | tee stats.txt
          fi

      # NOT continue-on-error, unlike the step this replaces. team_match_stats is declared ACTIVE,
      # which means an empty table is a real fault — so a failure here must fail the job and be
      # visible, rather than being swallowed and rediscovered by an audit a week later.
      - name: Commit the season store
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data 2>/dev/null || true
          git diff --staged --quiet && { echo "no new fixtures to store"; exit 0; }
          git commit -m "pro: team stats $(date -u '+%Y-%m-%d %H:%M UTC')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          echo "::error title=push failed::team stats collected but nothing was persisted."
          exit 1

      # The collector's own output, in the summary, whether it passed or failed. Both earlier
      # failures had to be diagnosed by elimination from outside — ruling out the credential,
      # the table registration and the required columns one at a time — because nothing the run
      # produced was readable without opening the raw log.
      - name: Publish the collector output
        if: always()
        run: |
          {
            echo "## Team stats"
            echo ""
            echo '```'
            tail -n 40 stats.txt 2>/dev/null || echo "(collector produced no output — it failed before printing)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Surface a collection failure
        if: failure()
        run: |
          # NAME THE REAL ERROR, do not guess at it. This used to say "check APIFOOTBALL_KEY and
          # the quota", which sent the investigation down two wrong paths: the credential is
          # present and working (pro_live_odds uses the same secret and commits data), and the
          # table had never collected once, so no quota had been spent on it. A guess in an error
          # message is worse than no message, because it is trusted.
          echo "::error title=team_match_stats did not collect::The table is declared ACTIVE, so \
          an empty one is a fault. Last collector output below; the run is chunked to 250 \
          fixtures and resumes from what is already stored, so a timeout should not recur."
          tail -n 25 stats.txt 2>/dev/null || echo "(no collector output captured)"
