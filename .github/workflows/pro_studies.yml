# Dependencies: canonical requirements.txt (2026-10-22).
name: Pro Studies (daily)

# Re-runs the October 2026 upgrade studies every day so the evidence updates itself:
#   argentina_btts   is the Argentina BTTS gap (realised vs implied) still open?
#   btts_league_regime  Serie B BTTS YES forward test: league regime vs model (owner 2026-10-29)
#   ou_studies       does the model add anything to the market once the price is known?
#   evidence         per-cell shrinkage, FDR, sequential CLV -> recommendations (never money)
#   ou_challenger    market-anchored O/U 2.5 challenger + its first-sight forward record
#   props_segments   pre-registered props segments (attacking D / M), forward from 2026-10-14
#   report           output/studies/REPORT.md
# Research only. Reads v9 through a read-only checkout; never writes into v9.
#
# API-Football results are cached per day in experiments/upgrade_studies_2026_10 (not committed);
# actions/cache keeps that cache between runs so a week costs ~10 calls, not ~70.

on:
  schedule:
    # DAILY, not Mon/Thu. Added Thu 2026-10-08 after that day's slot, then GitHub never delivered
    # the Monday 2026-10-12 slot either: four days with no run, and the O/U challenger's forward
    # record frozen at its first 200 fixtures. Once-daily schedules are delivered ~100% of the time
    # (CLAUDE.md, measured 2026-09-10), and with the results cache a run costs ~10 API calls.
    - cron: '20 6 * * *'
  # Also run when the studies or this file change, so a fix takes effect at once instead of
  # waiting for a slot GitHub may not deliver.
  push:
    branches: [main]
    paths: ['.github/workflows/pro_studies.yml', 'src/studies/**']
  workflow_dispatch:

concurrency:
  group: pro-studies
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  studies:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ref: main, not the triggering SHA. 2026-10-14: a push-triggered run and the daily run overlapped;
      # the queued one (concurrency waits) had checked out the OLD commit, regenerated the same files,
      # and its rebase conflicted on all 5 retries. Starting from the latest main, a queued run builds
      # on the previous run's committed output and appends instead of colliding.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out v9 (read-only)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          path: _v9
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore results cache
        uses: actions/cache@v4
        with:
          path: experiments/upgrade_studies_2026_10
          key: studies-results-${{ github.run_id }}
          restore-keys: studies-results-
      - name: Tests
        run: python -m pytest tests/test_studies.py tests/test_props_segments.py tests/test_calibration_shadow.py tests/test_btts_league_regime.py -q
      - name: Run studies
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: |
          set -o pipefail
          # Argentina's season cache must refresh: it holds matches still being played.
          rm -f experiments/upgrade_studies_2026_10/argentina_fixtures_2026.json
          for m in argentina_btts btts_league_regime ou_studies evidence ou_challenger props_segments calibration_shadow props_calibration tip_ranker top_picks_weekly league_results fantasy_benchmark report; do
            python -m src.studies.$m > "studies_$m.txt" 2>&1 || { echo "::error title=$m failed::"; tail -30 "studies_$m.txt"; exit 1; }
          done
          cat studies_report.txt
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # one path per add: a multi-path add stages nothing if any one is missing
          for p in output/studies/REPORT.md output/studies/argentina_btts.json output/studies/ou_studies.json \
                   output/studies/evidence.json output/studies/ou_challenger.json \
                   output/studies/ou_challenger_forward.csv \
                   output/studies/props_segments.json output/studies/PROPS_SEGMENTS.md \
                   output/studies/calibration_shadow.json output/studies/CALIBRATION_SHADOW.md \
                   output/studies/props_calibration.json output/studies/PROPS_CALIBRATION.md \
                   output/studies/tip_ranker.json output/studies/TIP_RANKER.md \
                   output/studies/top_picks_weekly.csv output/studies/TOP_PICKS_WEEKLY.md \
                   output/studies/league_results_weekly.csv output/studies/LEAGUE_RESULTS.md \
                   output/studies/league_ratings.json \
                   output/studies/fantasy_benchmark.json output/studies/fantasy_challenger_log.csv \
                   output/studies/btts_league_regime.json output/studies/BTTS_LEAGUE_REGIME.md; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet && exit 0
          git commit -m "pro: studies $(date -u '+%Y-%m-%d')"
          # No -X theirs on purpose: ou_challenger_forward.csv is first-sight append-only, and "newer
          # wins" would replace another run's earlier rows. Overlap is prevented at checkout instead.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          exit 1
      - name: Summary
        if: always()
        run: |
          { echo '```'; cat studies_report.txt 2>/dev/null | head -80; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
