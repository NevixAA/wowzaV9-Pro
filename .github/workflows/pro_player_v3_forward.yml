name: Pro Player V3 Forward Test

# Pre-registered forward test of the V3 prop market-residual rule (src/player_v3/forward.py).
# Daily: rebuild V3 features from v9's committed history (read-only), settle props on matches from
# 2026-10-15, score them with the FROZEN models + combination, and update
# output/player_v3/FORWARD_TEST.md. Paper only; nothing is sent and nothing reaches v9.
#
# scikit-learn is PINNED to the version that froze the models (registry/player_v3_forward/
# registration.json -> "sklearn"); unpickling under a different version could silently change scores.

on:
  schedule:
    - cron: '40 7 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/pro_player_v3_forward.yml', 'src/player_v3/forward.py']
  workflow_dispatch:

concurrency:
  group: pro-player-v3-forward
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # ref: main, not the triggering SHA: a run queued behind another (concurrency waits) must start
      # from the latest code and outputs (pro_studies.yml failed this way on 2026-10-14).
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out v9 (read-only)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          path: _v9
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas numpy pyarrow scipy pytest "scikit-learn==1.9.1"
      - name: Tests
        run: python -m pytest tests/test_player_v3_forward.py tests/test_prop_consensus.py tests/test_registrations_frozen.py -q
      - name: Forward test
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: |
          set -o pipefail
          python -m src.player_v3.forward | tee fwd.txt
          cat fwd.txt >> "$GITHUB_STEP_SUMMARY"
          # two-sided prop market consensus (forward-only research dataset, 2026-10-19)
          python -m src.player_v3.consensus | tee cons.txt
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in output/player_v3/forward_test.json output/player_v3/FORWARD_TEST.md \
                   output/player_v3/consensus/coverage.json output/player_v3/consensus/two_sided_pairs.csv \
                   output/player_v3/consensus/consensus.csv registry/player_v3_forward/registration_v2.json; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet && exit 0
          git commit -m "pro: player v3 forward test $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          exit 1
