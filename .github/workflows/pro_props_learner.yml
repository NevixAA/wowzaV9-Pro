# Dependencies: canonical requirements.txt (2026-10-22).
name: Pro Props Learner Study

# Can v9's player-prop models move from classic GradientBoosting to HistGradientBoosting without
# losing skill? See src/studies/props_learner.py for the reason (v9's props retrain outgrew its
# time limit on 2026-10-11) and the decision rule, fixed before any result.
#
# One job per market, in parallel: the classic learner needs ~15-35 min per market on the full
# 855k-row history, so eight markets in series would not fit one job. A final job merges.
# Research only: reads v9 through a read-only checkout, never writes into v9.

on:
  push:
    branches: [main]
    paths: ['.github/workflows/pro_props_learner.yml', 'src/studies/props_learner.py']
  workflow_dispatch:

concurrency:
  group: pro-props-learner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  market:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        market: [goals, goals2, assists, sot, sot2, sot3, sot4, cards]
    steps:
      - uses: actions/checkout@v4
      - name: Check out v9 (read-only)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          path: _v9
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # v9's own requirements, so the incumbent is fitted with the sklearn version v9 trains with
      - run: pip install -r _v9/requirements.txt
      - name: Run ${{ matrix.market }}
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: python -m src.studies.props_learner --market ${{ matrix.market }}
      - uses: actions/upload-artifact@v4
        with:
          name: props-learner-${{ matrix.market }}
          path: output/studies/props_learner_${{ matrix.market }}.json

  merge:
    needs: market
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The LATEST main, not the commit that started the run: the per-market jobs take ~50 min
      # and an earlier run's merge may have committed these same files meanwhile. Checking out
      # the old commit turned that into an add/add rebase conflict and the 2026-10-12 merge
      # failed on every retry with all 8 markets already computed.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: props-learner-*
          path: output/studies
          merge-multiple: true
      - name: Merge
        run: python -m src.studies.props_learner --merge | tee props_learner.txt
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # one path per add: a multi-path add stages nothing if any one is missing
          for p in output/studies/props_learner.json output/studies/PROPS_LEARNER.md; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet && exit 0
          git commit -m "pro: props learner study $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          exit 1
      - name: Summary
        if: always()
        run: cat props_learner.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
