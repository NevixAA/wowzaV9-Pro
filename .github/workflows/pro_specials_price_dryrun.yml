name: Pro Specials price dry run (temporary, prep/specials only)

# TEMPORARY (owner 2026-11-09 asked for a dry run of the real special-market price collection).
# Runs only on a push to prep/specials; writes and commits nothing. Removed after the dry run.

on:
  push:
    branches: [prep/specials]
    paths: ['.github/workflows/pro_specials_price_dryrun.yml']

permissions:
  contents: read

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use the LIVE fixture store from main (read-only; this branch's copy stops at 2026-11-01)
        run: git fetch -q origin main && git checkout origin/main -- data/season_2026_27/fixtures
      - name: Check out v9 (read-only)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          path: _v9
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r _v9/requirements.txt
      - name: Prices dry run (real API calls, nothing written)
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: python -m src.specials.prices --dry-run
