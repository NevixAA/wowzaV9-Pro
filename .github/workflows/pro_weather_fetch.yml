# Dependencies: canonical requirements.txt (2026-10-22).
name: Pro weather forecast-vs-actual fetch (resumable)

# Weather surprise study (src/studies/weather_surprise.py, owner 2026-10-19): fetches, per stadium and
# month, the Open-Meteo forecast as of one day before kickoff and the day-of value. One run spends at most
# ~8,000 weighted calls of the free 10,000/day and stops cleanly on a daily limit; each run resumes where
# the last stopped. When every match is fetched the job is a no-op. Read-only against v9.

on:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/pro_weather_fetch.yml', 'src/studies/weather_surprise.py']
  workflow_dispatch:

concurrency:
  group: pro-weather-fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests/test_weather_surprise.py -q
      - name: Fetch
        run: python -m src.studies.weather_surprise fetch | tee fetch.txt
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in output/studies/weather/match_weather_forecast.csv output/studies/weather/fetch_state.json; do
            [ -e "$f" ] && git add -f "$f"
          done
          git diff --staged --quiet && exit 0
          git commit -m "pro: weather forecast fetch $(date -u '+%F %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          exit 1
