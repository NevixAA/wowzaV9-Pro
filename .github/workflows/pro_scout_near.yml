name: Pro League Scout — closing prices

# Samples CLOSING prices for scout fixtures as kickoffs approach, inside one ~50-minute job.
#
# WHY A LOOP AND NOT MORE CRONS. GitHub does not fire crons on time (measured 2026-09-10; the
# scout's own first two slots on 2026-10-08 were skipped). A job that starts whenever and then
# samples against real kickoff times is robust to that. Each firing that lands covers every
# kickoff in its window; the 2-hourly sweep (pro_scout.yml) keeps running independently.
#
# WHY ONLY THE LAST ~75 MINUTES. Measured 2026-10-08: API-Football's pre-match price was ~4 h old
# more than an hour out, ~12 min old inside the final hour. Earlier sampling re-reads one number.
#
# COST. One /odds?fixture call per fixture per ~10-minute pass: on a busy hour ~40 fixtures x 6
# = ~240 calls. The collector stops at SCOUT_MIN_QUOTA so v9's predict loop is never starved.

on:
  schedule:
    # EVERY 3 HOURS, EACH RUN LIVING ~2h45m. Hourly 50-minute runs delivered 11 of ~72 slots over
    # 2026-10-08..11 (15%), and only 52% of scout fixtures were seen in their last 75 minutes.
    # Long runs make coverage depend on GitHub delivering a FEW runs a day — which it does — rather
    # than on hitting each hour. The concurrency group queues a late run behind a running one, so
    # runs chain instead of overlapping.
    - cron: '5 */3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'Loop length in minutes (default 165)'
        required: false

concurrency:
  group: pro-scout-near
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  near:
    runs-on: ubuntu-latest
    timeout-minutes: 185
    steps:
      # ref: main, not the triggering SHA. 2026-10-16 and 10-17: the 23:00 run waited behind the
      # previous near run (concurrency), started from the snapshot taken when it was SCHEDULED - before
      # that run committed last_near_run.json - sampled for 3 h, then conflicted on that file in all 5
      # rebase retries: closing prices sampled but never saved (they cannot be re-sampled later).
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas pyarrow requests numpy
      - name: Sample closing prices
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          set -o pipefail
          M="${{ github.event.inputs.minutes }}"; [ -n "$M" ] || M=165
          python -m src.scout.collect --near-loop "$M" 2>&1 | tee near.txt
      - name: Commit
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # one path per add: a multi-path add stages nothing if any one path is missing
          for p in data/season_*/scout_odds output/scout/last_near_run.json; do
            [ -e "$p" ] && git add "$p"
          done
          git diff --staged --quiet && { echo "nothing new"; exit 0; }
          git commit -m "pro: scout closing prices $(date -u '+%Y-%m-%d %H:%M UTC')"
          # -X theirs (in a rebase: the commit being replayed = this run) is safe HERE: the price files
          # are new, run-named partitions no other run writes, and the only shared file is the
          # last_near_run.json summary, where this run's version is the newer one.
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          echo "::error title=scout near push failed::closing prices were sampled but not persisted."
          exit 1
      - name: Summary
        if: always()
        run: |
          { echo '```'; tail -n 20 near.txt 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
