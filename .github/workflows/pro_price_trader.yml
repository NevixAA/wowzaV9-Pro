name: Pro Price Trader (paper)

# Price Trader / Arbitrage Lab (src/price_trader). Daily: rebuild trades + price paths from v9's
# recorded per-book quotes (read-only), re-run the lab, advance the PAPER engine (policy V1). No money,
# no Telegram, nothing reaches v9.

on:
  schedule:
    - cron: '50 7 * * *'
  push:
    branches: [main]
    paths: ['.github/workflows/pro_price_trader.yml', 'src/price_trader/**']
  workflow_dispatch:

concurrency:
  group: pro-price-trader
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # ref: main, not the triggering SHA: a run queued behind another (concurrency waits) must start
      # from the latest code and outputs (pro_studies.yml failed this way on 2026-10-14).
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Check out v9 (read-only)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          path: _v9
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest tests/test_price_trader_hedge.py tests/test_price_trader_v2.py -q
      - name: Lab + paper engine
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: |
          set -o pipefail
          python -m src.price_trader.lab > lab.txt
          python -m src.price_trader.paper | tee paper.txt
          # v2 (2026-10-19): fixed horizons, A/B/C labels, state machine, controls, breakeven, lineage
          python -m src.price_trader.research > research_v2.txt
          # research integrity (anti-cherry-picking checks; any FAIL blocks an EDGE verdict)
          python -m src.monitoring.research_integrity | tee integrity.txt
          cat paper.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/price_trader registry/price_trader output/research_integrity.json
          git diff --staged --quiet && exit 0
          git commit -m "pro: price trader $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            sleep $((RANDOM % 5 + 3))
          done
          exit 1
