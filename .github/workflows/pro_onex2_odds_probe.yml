name: Pro 1X2 odds coverage probe (3 calls, dispatch only)

# Owner 2026-11-09: spend 3 API-Football calls to confirm 1X2 (Match Winner) odds coverage and
# history depth for K League 1 (292), Romania Liga I (283) and the Saudi Pro League (307).
# One /odds?league&season=2026&bet=1 call per league: results > 0 = coverage now; finished fixtures
# (kickoff before now) among them = how far back API-Football still holds prices. Uses the scout's
# client (retries, rate limits) with the owner's 25k quota floor. Writes the job summary and an
# artifact; commits nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Probe (3 calls)
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          SCOUT_MIN_QUOTA: '25000'
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee probe.txt
          import json, time
          from src.scout import af
          c = af.Client()
          now = int(time.time())
          out = {"probed_at": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(now)), "leagues": {}}
          for lid in (292, 283, 307):
              body = c.get("/odds", {"league": lid, "season": 2026, "bet": 1}) or {}
              resp = body.get("response") or []
              ko = [int((x.get("fixture") or {}).get("timestamp") or 0) for x in resp]
              ko = [k for k in ko if k]
              books = [len(x.get("bookmakers") or []) for x in resp]
              mw = sum(1 for x in resp for b in (x.get("bookmakers") or []) for bet in (b.get("bets") or [])
                       if bet.get("name") == "Match Winner"
                       and {str(v.get("value")) for v in (bet.get("values") or [])} >= {"Home", "Draw", "Away"})
              names = sorted({b.get("name") for x in resp for b in (x.get("bookmakers") or [])})
              out["leagues"][lid] = {
                  "results": body.get("results"), "paging": body.get("paging"), "errors": body.get("errors"),
                  "fixtures_on_page": len(resp),
                  "kickoff_min_utc": time.strftime("%Y-%m-%d %H:%M", time.gmtime(min(ko))) if ko else None,
                  "kickoff_max_utc": time.strftime("%Y-%m-%d %H:%M", time.gmtime(max(ko))) if ko else None,
                  "fixtures_already_kicked_off": sum(1 for k in ko if k <= now),
                  "bookmakers_per_fixture": books, "match_winner_book_quotes_all_3_outcomes": mw,
                  "bookmakers": names}
          out["api_calls"] = c.calls
          out["quota_remaining_after"] = c.remaining
          print(json.dumps(out, indent=1))
          json.dump(out, open("probe.json", "w"), indent=1)
          PY
      - name: Summary
        if: always()
        run: |
          { echo "## 1X2 odds coverage probe"; echo '```'; cat probe.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onex2-odds-probe
          path: probe.json
