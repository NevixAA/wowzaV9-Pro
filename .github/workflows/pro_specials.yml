name: Pro Specials (research)

# Specials research tracker (owner 2026-11-09): high-scoring (5+/6+/7+ goals, a side scoring 4+,
# 4+ margin), 0-0 / low-scoring and unusual exact-score matches, each against the LEAGUE'S OWN
# history. Every upcoming fixture the score model can rate is logged once, before kickoff, with the
# full exact-score grid 0-0..6-6, the goal and margin bands, the league base rates, the raw AND the
# calibrated special probabilities, and the REAL special-market prices collected this run; results
# are graded beside the log from v9's repaired history (90 minutes).
#
# RESEARCH ONLY. No Telegram, no tiers, no stakes: this workflow passes no credential that could
# send anything. The API-Football key is used for /status, /fixtures and /odds only, never below
# the 25,000-request floor and at most 250 calls a run (src/specials/prices.py). It commits only its
# own files under output/specials/.
#
# GO-LIVE: OFF until the owner switches it on - the only step is setting the repository variable
# PRO_SPECIALS_ENABLED to 'true' (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    # Daily, off the hour and clear of the other Pro crons (paper 1X2 is :41 7).
    - cron: '53 7 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'log | settle | evaluate | all'
        required: false
        default: 'all'
        type: choice
        options: ['all', 'log', 'settle', 'evaluate']
      study:
        description: 'Re-run the history study (rewrites cutoffs.json + calibration.json); also runs on the 1st'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      dry_run:
        description: 'Compute and report, write nothing'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

concurrency:
  group: pro-specials
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  specials:
    if: vars.PRO_SPECIALS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # v9 read-only: its repaired history (data_loader, offline), its name resolver, its league-id
      # map and its Over/Under 1.5 captures. Nothing is written back.
      - name: Check out v9 (read-only)
        uses: actions/checkout@v4
        with:
          repository: NevixAA/wowza-betting
          path: _v9
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # v9's own requirements too: the repaired history is read through v9's data_loader.
      - run: pip install -r requirements.txt -r _v9/requirements.txt

      - name: History study + calibration (on request)
        if: github.event.inputs.study == 'true'
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: |
          set -o pipefail
          python -m src.specials.study --out output/specials 2>&1 | tee study.txt

      - name: Monthly study + calibration on the 1st (schedule)
        if: github.event_name == 'schedule'
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: |
          set -o pipefail
          if [ "$(date -u +%d)" = "01" ]; then
            python -m src.specials.study --out output/specials 2>&1 | tee study.txt
          else
            echo "not the 1st - cutoffs and calibration kept"
          fi

      - name: Real special-market prices (API-Football /odds)
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
        run: |
          set -o pipefail
          FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python -m src.specials.prices $FLAG 2>&1 | tee prices.txt

      - name: Log, settle, evaluate
        env:
          V9_LOCAL: ${{ github.workspace }}/_v9
        run: |
          set -o pipefail
          MODE="${{ github.event.inputs.mode }}"; [ -z "$MODE" ] && MODE=all
          FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then FLAG="--dry-run"; fi
          python -m src.specials.tracker --mode "$MODE" $FLAG 2>&1 | tee specials.txt

      - name: Publish the summary
        if: always()
        run: |
          {
            echo "## Specials (research)"
            echo '```'
            tail -n 20 study.txt 2>/dev/null || true
            tail -n 20 prices.txt 2>/dev/null || true
            tail -n 20 specials.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit the record
        if: success() && github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for f in specials_log.csv specials_settled.csv specials_eval.json cutoffs.json calibration.json \
                   study_summary.json study_calibration_grid.csv study_calibration_bands.csv \
                   special_prices.csv special_price_runs.csv; do
            [ -f "output/specials/$f" ] && git add -f "output/specials/$f"
          done
          git diff --staged --quiet && { echo "no change"; exit 0; }
          git commit -m "pro: specials research $(date -u '+%Y-%m-%d')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race - retry $i"; sleep $((RANDOM % 5 + 3))
          done
          echo "::error title=push failed::Specials rows were logged but NOT persisted."
          exit 1
